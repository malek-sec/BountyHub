{% extends "base.html" %}
{% block title %}New Program{% endblock %}

{% block head %}
<style>
    .prg-new, .prg-new * { font-family: var(--font-body); }
    .prg-new-section { margin-bottom: var(--s3); }

    .prg-new-header h1 { font-size: var(--t-2xl); color: var(--ink); margin-top: var(--s1); }
    .prg-new-header p  { color: var(--ink-soft); margin-top: 6px; font-size: 15px; }

    .form-wrap { max-width: 640px; }
    .form-card { padding: var(--s4); }

    .field { margin-bottom: var(--s3); }
    .field label {
        display: block; margin-bottom: 6px;
        font-family: var(--font-mono); font-size: 11px;
        letter-spacing: .05em; text-transform: uppercase;
        color: var(--ink-soft);
    }
    .field .req { color: var(--accent); margin-left: 4px; }

    .actions {
        display: flex; align-items: center; gap: var(--s2);
        margin-top: var(--s4); flex-wrap: wrap;
    }
</style>
{% endblock %}

{% block content %}
<div class="prg-new">

    <header class="prg-new-header prg-new-section fade-up">
        <span class="eyebrow">Bug bounty</span>
        <h1>New program</h1>
        <p>Add a program to group your vulnerability findings.</p>
    </header>

    <div class="form-wrap fade-up d1">
        <div class="panel form-card">
            <form method="POST" action="{{ url_for('programs.new') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                <div class="field">
                    <label for="p-name">Program name<span class="req">*</span></label>
                    <input type="text" name="name" id="p-name"
                           placeholder="e.g. Acme Corp" required autofocus>
                </div>

                <div class="field">
                    <label for="p-platform">Platform</label>
                    <select name="platform" id="p-platform">
                        <option value="">— Select platform —</option>
                        <option value="HackerOne">HackerOne</option>
                        <option value="Bugcrowd">Bugcrowd</option>
                        <option value="Intigriti">Intigriti</option>
                        <option value="Private">Private</option>
                    </select>
                </div>

                <div class="field">
                    <label for="p-scope">Scope</label>
                    <textarea name="scope" id="p-scope" rows="5"
                              placeholder="*.acme.com&#10;api.acme.com&#10;— Out of scope: *.staging.acme.com"></textarea>
                </div>

                <div class="field">
                    <label for="p-url">Policy URL</label>
                    <input type="url" name="policy_url" id="p-url"
                           placeholder="https://hackerone.com/acme">
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">Create program</button>
                    <a href="{{ url_for('programs.index') }}" class="btn btn-ghost">← Back</a>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
